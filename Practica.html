<body>
  <article class="Catálogo">
    <img src="Guante de beisbol.jpg" alt=""> 
    <div class="tarjeta-contenido">
      <h2 class="tarjeta-titulo">Guante de beisbol</h2>
      <p class="tarjeta-texto">Este es un guante de beisbol de 15.5.</p>
      <a href="" class="tarjeta-boton">Ver más</a>
    </div><style>
    .tarjeta {
      width: 300px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
      overflow: hidden;
      font-family: Arial, sans-serif;
      background-color: #ffffff;
    }

    .tarjeta img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      display: block;
    }

    .tarjeta-contenido {
      padding: 16px;
    }

    .tarjeta-titulo {
      margin: 0 0 8px;
      font-size: 1.25rem;
    }

    .tarjeta-texto {
      margin: 0 0 16px;
      color: #555555;
      font-size: 0.95rem;
    }

    .tarjeta-boton {
      display: inline-block;
      padding: 8px 14px;
      background-color: #4a94df;
      color: #ffffff;
      text-decoration: none;
      border-radius: 6px;
      font-size: 0.9rem;
    }

    .tarjeta-boton:hover {
      background-color: #004c99;
    }
    body{
        background-color: aqua;
    }
  </style>
  </article>
